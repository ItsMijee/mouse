<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mouse Maze 3D: Trapped!</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        body, html {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #game-container {
            position: relative;
            width: 100%; max-width: 480px;
            height: 100%; max-height: 850px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            border-radius: 16px;
            background: #1a1a1a;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
        }
        #game-canvas { z-index: 5; touch-action: none; }

        #ui-header {
            position: relative;
            z-index: 10;
            display: none;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            width: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }
        .btn-header {
            width: 48px; height: 48px;
            background: linear-gradient(145deg, #ffe17d, #d4a73b);
            border: 2px solid #fff; border-radius: 14px;
            box-shadow: 0 5px 0 #946f19, 0 8px 15px rgba(0,0,0,0.3);
            display: flex; justify-content: center; align-items: center;
            font-weight: 900; font-size: 20px; color: #4a3300;
            cursor: pointer; transition: transform 0.1s, box-shadow 0.1s;
        }
        .btn-header:active { transform: translateY(4px); box-shadow: 0 1px 0 #946f19; }
        
        #level-info-container {
            display: flex; flex-direction: column; align-items: center;
        }
        #level-badge {
            background: linear-gradient(145deg, #ffe17d, #d4a73b);
            border: 2px solid #fff; border-radius: 25px;
            padding: 8px 30px; box-shadow: 0 5px 0 #946f19, 0 8px 15px rgba(0,0,0,0.3);
            font-weight: 900; font-size: 18px; color: #4a3300;
            letter-spacing: 1px; text-transform: uppercase;
        }
        #theme-title {
            font-size: 11px; font-weight: 800; color: #ffffff;
            margin-top: 5px; text-shadow: 0 2px 5px rgba(0,0,0,0.8);
            letter-spacing: 1.5px; text-transform: uppercase;
        }

        .fullscreen-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
        }

        /* LOADING SCREEN DENGAN LATAR ABU-ABU */
        #loading-screen { 
            background: linear-gradient(135deg, #2c3e50, #1a252f, #11181e); 
            color: #fff; padding: 20px; text-align: center;
        }
        .loading-logo {
            font-size: 36px; font-weight: 900; color: #f1c40f;
            text-shadow: 0 0 25px rgba(241,196,15,0.7);
            margin-bottom: 30px; letter-spacing: 2px;
        }
        .progress-bar-container {
            width: 80%; height: 22px; background: rgba(0,0,0,0.6);
            border-radius: 12px; border: 2px solid #f1c40f;
            padding: 2px; overflow: hidden;
            box-shadow: 0 0 15px rgba(241,196,15,0.4);
        }
        #progress-fill { 
            width: 0%; height: 100%; 
            background: linear-gradient(90deg, #f1c40f, #2ecc71); 
            border-radius: 8px; transition: width 0.2s ease-out;
        }
        .loading-text { margin-top: 18px; font-size: 15px; font-weight: bold; color: #f1c40f; letter-spacing: 1px; }

        /* MENU UTAMA DENGAN BACKGROUND BLUR (background.png) */
        #main-menu { 
            display: none; z-index: 900; 
            background: url('assets/background.png') center/cover no-repeat;
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        }
        #main-menu::before {
            content: "";
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: -1;
        }

        .game-title-container {
            text-align: center; margin-bottom: 40px; position: relative;
        }
        .game-title {
            font-size: 42px; font-weight: 900; line-height: 1.1;
            background: linear-gradient(180deg, #fff 0%, #f1c40f 50%, #e67e22 100%);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 6px 0px #19381f) drop-shadow(0 10px 20px rgba(0,0,0,0.5));
            animation: titlePulse 2.5s infinite ease-in-out;
            letter-spacing: 2px;
        }
        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }

        .btn-main {
            background: linear-gradient(145deg, #2ecc71, #27ae60);
            color: white; border: 2px solid #abebc6; border-radius: 20px;
            padding: 18px; font-size: 22px; font-weight: 900; margin: 10px 0; width: 240px;
            box-shadow: 0 8px 0 #1e8449, 0 12px 25px rgba(0,0,0,0.4);
            cursor: pointer; transition: all 0.1s; letter-spacing: 1px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.4);
        }
        .btn-main:active { transform: translateY(6px); box-shadow: 0 2px 0 #1e8449; }
        .btn-setting { 
            background: linear-gradient(145deg, #f1c40f, #f39c12); 
            border-color: #f9e79f;
            box-shadow: 0 8px 0 #b7950b, 0 12px 25px rgba(0,0,0,0.4); 
        }
        .btn-setting:active { box-shadow: 0 2px 0 #b7950b; }

        /* MODAL & SETTING OVERLAY */
        .modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            align-items: center; justify-content: center; z-index: 1100;
        }
        .modal-card {
            background: linear-gradient(145deg, #ffffff, #f0f3f4); 
            border-radius: 25px; padding: 45px 25px 30px; text-align: center;
            width: 85%; max-width: 340px; position: relative; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.5); border: 3px solid #fff;
        }
        .modal-badge {
            position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(145deg, #f1c40f, #f39c12); 
            border: 3px solid #fff; border-radius: 25px;
            padding: 8px 30px; font-weight: 900; font-size: 18px; color: #4a3300; 
            box-shadow: 0 5px 0 #b7950b; white-space: nowrap;
        }
        .modal-msg { color: #2c3e50; font-weight: 800; font-size: 20px; margin-bottom: 25px; }

        .modal-actions { display: flex; justify-content: center; gap: 20px; }
        .btn-icon {
            width: 60px; height: 60px; 
            background: linear-gradient(145deg, #f1c40f, #d4ac0d); 
            border: 2px solid #fff; border-radius: 18px;
            box-shadow: 0 6px 0 #9a7d0a; display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .btn-icon:active { transform: translateY(5px); box-shadow: 0 1px 0 #9a7d0a; }
        .btn-icon svg { width: 32px; height: 32px; fill: #4a3300; }

        .setting-row { display: flex; justify-content: space-between; align-items: center; margin: 18px 0; color: #2c3e50; font-weight: bold; }
        input[type=range] { accent-color: #f39c12; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- LOADING SCREEN -->
    <div id="loading-screen" class="fullscreen-overlay">
        <div class="loading-logo">MOUSE MAZE 3D</div>
        <div class="progress-bar-container"><div id="progress-fill"></div></div>
        <p id="loading-text" class="loading-text">Menyiapkan dunia 3D... 0%</p>
    </div>

    <!-- MAIN MENU -->
    <div id="main-menu" class="fullscreen-overlay">
        <div class="game-title-container">
            <div class="game-title">MOUSE MAZE<br>3D TRAPPED</div>
        </div>
        <button id="btn-play-menu" class="btn-main">PLAY</button>
        <button id="btn-setting-menu" class="btn-main btn-setting">SETTING</button>
    </div>

    <!-- UI HEADER GAMEPLAY -->
    <div id="ui-header">
        <button class="btn-header" id="btn-sound">🔊</button>
        <div id="level-info-container">
            <div id="level-badge">LEVEL 1</div>
            <div id="theme-title">SPRING MEADOW</div>
        </div>
        <button class="btn-header" id="btn-pause">||</button>
    </div>

    <!-- CANVAS GAME -->
    <canvas id="game-canvas"></canvas>

    <!-- MODAL HASIL -->
    <div id="game-modal" class="modal">
        <div class="modal-card">
            <div id="modal-badge" class="modal-badge">GAME OVER</div>
            <div id="modal-msg" class="modal-msg">TIKUS BERHASIL KABUR!</div>
            <div class="modal-actions">
                <button class="btn-icon" id="btn-home" title="Menu Utama">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                </button>
                <button class="btn-icon" id="btn-action" title="Lanjut / Ulang">
                    <svg viewBox="0 0 24 24" id="icon-repeat"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    <svg viewBox="0 0 24 24" id="icon-next" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL PAUSE / SETTING -->
    <div id="pause-modal" class="modal">
        <div class="modal-card">
            <div class="modal-badge">PENGATURAN</div>
            <div class="setting-row">
                <label>Musik BG</label>
                <input type="range" id="bgm-vol" min="0" max="1" step="0.1" value="0.9">
            </div>
            <div class="setting-row">
                <label>Efek Suara</label>
                <input type="range" id="sfx-vol" min="0" max="1" step="0.1" value="1.0">
            </div>
            <br>
            <button class="btn-main btn-setting" id="btn-resume" style="width:100%; padding: 14px; font-size: 18px; margin: 0;">KEMBALI</button>
            <button class="btn-main" id="btn-quit" style="width:100%; padding: 14px; font-size: 18px; margin: 12px 0 0 0; background: linear-gradient(145deg, #e74c3c, #c0392b); border-color: #f5b7b1; box-shadow: 0 6px 0 #7b241c;">KELUAR</button>
        </div>
    </div>
</div>

<script>
var imgAssets = {};
var audioAssets = {};

var assetSources = {
    img: { 
        mouse: 'assets/mouse.png',
        bg: 'assets/background.png'
    },
    audio: {
        bgm: 'assets/backsound.mp3',
        clickUI: 'assets/buttonclick.mp3',
        grass: 'assets/clickgrass.mp3',
        win: 'assets/win.mp3',
        lose: 'assets/lose.mp3'
    }
};

for (var imgKey in assetSources.img) {
    imgAssets[imgKey] = new Image();
    imgAssets[imgKey].src = assetSources.img[imgKey];
}
for (var audioKey in assetSources.audio) {
    audioAssets[audioKey] = new Audio(assetSources.audio[audioKey]);
    if (audioKey === 'bgm') audioAssets[audioKey].loop = true;
}

// LOADING SCREEN 20 DETIK
var loadingDuration = 20000; 
var startTime = Date.now();

var loadingInterval = setInterval(function() {
    var elapsed = Date.now() - startTime;
    var progress = Math.min(100, Math.floor((elapsed / loadingDuration) * 100));
    
    var progressFill = document.getElementById('progress-fill');
    var loadingText = document.getElementById('loading-text');
    
    if (progressFill) progressFill.style.width = progress + '%';
    if (loadingText) loadingText.innerText = 'Menyiapkan dunia 3D... ' + progress + '%';

    if (progress >= 100) {
        clearInterval(loadingInterval);
        setTimeout(function() {
            var loadingScreen = document.getElementById('loading-screen');
            var mainMenu = document.getElementById('main-menu');
            if (loadingScreen) loadingScreen.style.display = 'none';
            if (mainMenu) mainMenu.style.display = 'flex';
        }, 300);
    }
}, 50);

var sfxVolume = 1.0;

function playAudio(key) {
    if (audioAssets[key]) {
        if (key === 'bgm') {
            audioAssets[key].volume = 0.9;
        } else {
            audioAssets[key].currentTime = 0;
            audioAssets[key].volume = sfxVolume;
        }
        audioAssets[key].play().catch(function() {});
    }
}

var THEMES = [
    { 
        name: "Spring Meadow", 
        bgTop: "#4facfe", bgBottom: "#00f2fe", 
        topLight: "#72d572", topDark: "#52be52", sideColor: "#5c3a21", 
        particleType: "butterfly" 
    },
    { 
        name: "Snowy Winter", 
        bgTop: "#83a4d4", bgBottom: "#b6fbff", 
        topLight: "#e0f7fa", topDark: "#b2ebf2", sideColor: "#455a64", 
        particleType: "snow",
        hasSnowCap: true
    },
    { 
        name: "Summer Desert", 
        bgTop: "#ff9966", bgBottom: "#ff5e62", 
        topLight: "#f4d03f", topDark: "#d4ac0d", sideColor: "#9a7d0a", 
        particleType: "dust" 
    },
    { 
        name: "Autumn Woods", 
        bgTop: "#3a1c71", bgBottom: "#d76d77", 
        topLight: "#e59866", topDark: "#dc7d32", sideColor: "#6e2c00", 
        particleType: "redLeaf" 
    }
];

function getThemeByLevel(lvl) {
    var index = Math.floor((lvl - 1) / 5) % THEMES.length;
    return THEMES[index];
}

function getSavedLevel() {
    var saved = localStorage.getItem('mouse_maze_level');
    return saved ? parseInt(saved, 10) : 1;
}

function saveLevel(lvl) {
    localStorage.setItem('mouse_maze_level', lvl.toString());
}

// PERBANYAK JUMLAH BLOK (10x10)
var ROWS = 10; 
var COLS = 10;
var currentLevel = getSavedLevel();

function BlockCell(r, c) {
    this.r = r; 
    this.c = c; 
    this.blocked = false; 
    this.height = 0;
    this.targetHeight = 0;
    this.x = 0; 
    this.y = 0;
}

var particles = [];

function initParticles(type) {
    particles = [];
    for (var i = 0; i < 30; i++) {
        particles.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 4 + 2,
            speedX: (Math.random() - 0.5) * 1.5,
            speedY: Math.random() * 1.5 + 0.5,
            color: type === 'snow' ? '#ffffff' : (type === 'dust' ? '#f5b041' : '#f4d03f')
        });
    }
}

function updateAndDrawParticles(type) {
    ctx.save();
    particles.forEach(function(p) {
        p.x += p.speedX;
        p.y += p.speedY;

        if (p.y > canvas.height) p.y = -10;
        if (p.x > canvas.width) p.x = 0;
        if (p.x < 0) p.x = canvas.width;

        ctx.fillStyle = p.color;
        ctx.beginPath();
        if (type === 'butterfly') {
            ctx.ellipse(p.x, p.y, p.size, p.size * 0.5, Math.PI / 4, 0, Math.PI * 2);
        } else {
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        }
        ctx.fill();
    });
    ctx.restore();
}

var grid = [];
var mousePos = { r: 4, c: 4 };
var animatedMousePos = { x: 0, y: 0 };
var isPaused = false;
var gameOver = false;
var blockWidth = 44;
var blockHeight = 22; // Rasio diperpendek agar sudut pandang tampak lebih tinggi
var inMenu = true;

var canvas = document.getElementById('game-canvas');
var ctx = canvas.getContext('2d');

function resizeCanvas() {
    if (!canvas.parentElement) return;
    canvas.width = canvas.parentElement.clientWidth;
    canvas.height = canvas.parentElement.clientHeight;
    
    blockWidth = Math.min(canvas.width / (COLS + 1.5), 48);
    blockHeight = blockWidth * 0.45; // Mengubah tampilan perspektif lebih tegak dari atas
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function getBlockCoordinates(r, c) {
    var startX = canvas.width / 2;
    var startY = canvas.height / 2 - (ROWS * blockHeight * 0.2);
    
    var isoX = startX + (c - r) * (blockWidth * 0.5);
    var isoY = startY + (c + r) * (blockHeight * 0.5);
    return { x: isoX, y: isoY };
}

function initGrid() {
    grid = [];
    for (var r = 0; r < ROWS; r++) {
        grid[r] = [];
        for (var c = 0; c < COLS; c++) {
            grid[r][c] = new BlockCell(r, c);
        }
    }
    mousePos = { r: Math.floor(ROWS / 2), c: Math.floor(COLS / 2) };
    var startCoord = getBlockCoordinates(mousePos.r, mousePos.c);
    animatedMousePos = { x: startCoord.x, y: startCoord.y };
    
    // SESUAIKAN TINGKAT KESULITAN BERDASARKAN LEVEL
    // Level awal dapat bantuan rintangan lebih banyak, level tinggi rintangan lebih sedikit
    var baseObstacles = Math.max(5, 18 - Math.floor(currentLevel * 0.25));
    var count = 0;
    while (count < baseObstacles) {
        var rr = Math.floor(Math.random() * ROWS);
        var cc = Math.floor(Math.random() * COLS);
        if ((rr !== mousePos.r || cc !== mousePos.c) && !grid[rr][cc].blocked) {
            grid[rr][cc].blocked = true;
            grid[rr][cc].height = 12;
            grid[rr][cc].targetHeight = 12;
            count++;
        }
    }
    initParticles(getThemeByLevel(currentLevel).particleType);
}

function drawMinecraftBlock3D(x, y, w, h, block) {
    ctx.save();
    
    block.height += (block.targetHeight - block.height) * 0.25;
    var currY = y - block.height;

    var halfW = w / 2;
    var halfH = h / 2;
    var depth = 12 + block.height * 0.3; // Sisi 3D dibuat agak tipis agar sudut pandang dari atas makin maksimal

    var theme = getThemeByLevel(currentLevel);

    // SISI KIRI 3D
    ctx.fillStyle = theme.sideColor;
    ctx.beginPath();
    ctx.moveTo(x - halfW, currY);
    ctx.lineTo(x, currY + halfH);
    ctx.lineTo(x, currY + halfH + depth);
    ctx.lineTo(x - halfW, currY + depth);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)";
    ctx.stroke();

    // SISI KANAN 3D
    ctx.fillStyle = "rgba(0,0,0,0.22)";
    ctx.beginPath();
    ctx.moveTo(x, currY + halfH);
    ctx.lineTo(x + halfW, currY);
    ctx.lineTo(x + halfW, currY + depth);
    ctx.lineTo(x, currY + halfH + depth);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = theme.sideColor;
    ctx.fill();

    // PERMUKAAN ATAS
    ctx.beginPath();
    ctx.moveTo(x, currY - halfH);
    ctx.lineTo(x + halfW, currY);
    ctx.lineTo(x, currY + halfH);
    ctx.lineTo(x - halfW, currY);
    ctx.closePath();
    
    ctx.fillStyle = (block.r + block.c) % 2 === 0 ? theme.topLight : theme.topDark;
    ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,0.35)";
    ctx.lineWidth = 1.2;
    ctx.stroke();

    if (theme.hasSnowCap) {
        ctx.fillStyle = "rgba(255, 255, 255, 0.85)";
        ctx.beginPath();
        ctx.moveTo(x, currY - halfH);
        ctx.lineTo(x + halfW * 0.8, currY - halfH * 0.2);
        ctx.lineTo(x, currY + halfH * 0.6);
        ctx.lineTo(x - halfW * 0.8, currY - halfH * 0.2);
        ctx.closePath();
        ctx.fill();
    }

    ctx.restore();
}

function drawMouseHD() {
    var targetCoord = getBlockCoordinates(mousePos.r, mousePos.c);
    
    animatedMousePos.x += (targetCoord.x - animatedMousePos.x) * 0.25;
    animatedMousePos.y += (targetCoord.y - animatedMousePos.y) * 0.25;

    var currentBlock = grid[mousePos.r][mousePos.c];
    var mouseY = animatedMousePos.y - currentBlock.height;
    var size = blockWidth * 1.2;

    ctx.save();
    ctx.fillStyle = "rgba(0,0,0,0.3)";
    ctx.beginPath();
    ctx.ellipse(animatedMousePos.x, mouseY + 3, size * 0.22, size * 0.11, 0, 0, Math.PI * 2);
    ctx.fill();

    if (imgAssets.mouse && imgAssets.mouse.complete && imgAssets.mouse.naturalWidth !== 0) {
        ctx.drawImage(imgAssets.mouse, animatedMousePos.x - size / 2, mouseY - size * 0.75, size, size);
    } else {
        ctx.fillStyle = '#e74c3c';
        ctx.beginPath();
        ctx.arc(animatedMousePos.x, mouseY - 14, 12, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.restore();
}

function render() {
    if (inMenu) return;
    var theme = getThemeByLevel(currentLevel);

    var bgGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
    bgGrad.addColorStop(0, theme.bgTop);
    bgGrad.addColorStop(1, theme.bgBottom);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    updateAndDrawParticles(theme.particleType);

    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var block = grid[r][c];
            var coord = getBlockCoordinates(r, c);
            block.x = coord.x; block.y = coord.y;
            drawMinecraftBlock3D(coord.x, coord.y, blockWidth, blockHeight, block);
            
            if (r === mousePos.r && c === mousePos.c) {
                drawMouseHD();
            }
        }
    }

    if (!isPaused) requestAnimationFrame(render);
}

function getNeighbors(r, c) {
    var dirs = [
        {r:-1, c:0}, {r:1, c:0},
        {r:0, c:-1}, {r:0, c:1}
    ];
    var res = [];
    dirs.forEach(function(d) {
        var nr = r + d.r, nc = c + d.c;
        if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) res.push({ r: nr, c: nc });
    });
    return res;
}

function moveMouse() {
    var isAtEdge = (mousePos.r === 0 || mousePos.r === ROWS - 1 || mousePos.c === 0 || mousePos.c === COLS - 1);
    if (isAtEdge) {
        showEndModal(false);
        return;
    }

    var queue = [[mousePos]];
    var visited = new Set([mousePos.r + ',' + mousePos.c]);
    var targetPath = null;

    while (queue.length > 0) {
        var path = queue.shift();
        var curr = path[path.length - 1];
        if (curr.r === 0 || curr.r === ROWS - 1 || curr.c === 0 || curr.c === COLS - 1) { 
            targetPath = path; 
            break; 
        }
        var neighbors = getNeighbors(curr.r, curr.c);
        for (var i = 0; i < neighbors.length; i++) {
            var n = neighbors[i];
            if (!grid[n.r][n.c].blocked && !visited.has(n.r + ',' + n.c)) {
                visited.add(n.r + ',' + n.c); 
                queue.push(path.concat([n]));
            }
        }
    }

    if (targetPath && targetPath.length > 1) {
        mousePos = targetPath[1];
    } else {
        var nbs = getNeighbors(mousePos.r, mousePos.c).filter(function(n) { return !grid[n.r][n.c].blocked; });
        if (nbs.length > 0) {
            mousePos = nbs[Math.floor(Math.random() * nbs.length)];
        } else {
            showEndModal(true);
            return;
        }
    }
}

function showEndModal(isWin) {
    gameOver = true; isPaused = true;
    setTimeout(function() { playAudio(isWin ? 'win' : 'lose'); }, 100);
    
    var modalBadge = document.getElementById('modal-badge');
    var modalMsg = document.getElementById('modal-msg');
    var iconRepeat = document.getElementById('icon-repeat');
    var iconNext = document.getElementById('icon-next');
    var gameModal = document.getElementById('game-modal');

    if (modalBadge) modalBadge.innerText = isWin ? 'LEVEL CLEARED' : 'GAME OVER';
    if (modalMsg) modalMsg.innerText = isWin ? 'LEVEL ' + currentLevel + ' SELESAI!' : 'TIKUS BERHASIL KABUR!';
    if (iconRepeat) iconRepeat.style.display = isWin ? 'none' : 'block';
    if (iconNext) iconNext.style.display = isWin ? 'block' : 'none';
    
    var btnAction = document.getElementById('btn-action');
    if (btnAction) {
        btnAction.onclick = function() { 
            playAudio('clickUI'); 
            if (isWin) {
                currentLevel = Math.min(100, currentLevel + 1);
                saveLevel(currentLevel);
            }
            startLevel(); 
        };
    }
    if (gameModal) gameModal.style.display = 'flex';
}

function startLevel() {
    inMenu = false; gameOver = false; isPaused = false;
    var currentTheme = getThemeByLevel(currentLevel);
    
    var mainMenu = document.getElementById('main-menu');
    var gameModal = document.getElementById('game-modal');
    var pauseModal = document.getElementById('pause-modal');
    var uiHeader = document.getElementById('ui-header');
    var levelBadge = document.getElementById('level-badge');
    var themeTitle = document.getElementById('theme-title');

    if (mainMenu) mainMenu.style.display = 'none';
    if (gameModal) gameModal.style.display = 'none';
    if (pauseModal) pauseModal.style.display = 'none';
    if (uiHeader) uiHeader.style.display = 'flex';
    
    if (levelBadge) levelBadge.innerText = 'LEVEL ' + currentLevel;
    if (themeTitle) themeTitle.innerText = currentTheme.name;
    
    resizeCanvas();
    initGrid();
    requestAnimationFrame(render);
}

var btnPlayMenu = document.getElementById('btn-play-menu');
var btnSettingMenu = document.getElementById('btn-setting-menu');
var btnHome = document.getElementById('btn-home');
var btnPause = document.getElementById('btn-pause');
var btnResume = document.getElementById('btn-resume');
var btnQuit = document.getElementById('btn-quit');
var btnSound = document.getElementById('btn-sound');

if (btnPlayMenu) btnPlayMenu.onclick = function() { playAudio('clickUI'); playAudio('bgm'); startLevel(); };
if (btnSettingMenu) btnSettingMenu.onclick = function() { playAudio('clickUI'); var p = document.getElementById('pause-modal'); if (p) p.style.display = 'flex'; };

if (btnHome) btnHome.onclick = function() {
    playAudio('clickUI');
    var g = document.getElementById('game-modal');
    var u = document.getElementById('ui-header');
    var m = document.getElementById('main-menu');
    if (g) g.style.display = 'none';
    if (u) u.style.display = 'none';
    if (m) m.style.display = 'flex';
    inMenu = true; isPaused = true; ctx.clearRect(0, 0, canvas.width, canvas.height);
};

if (btnPause) btnPause.onclick = function() { playAudio('clickUI'); isPaused = true; var p = document.getElementById('pause-modal'); if (p) p.style.display = 'flex'; };
if (btnResume) btnResume.onclick = function() { playAudio('clickUI'); isPaused = false; var p = document.getElementById('pause-modal'); if (p) p.style.display = 'none'; if (!inMenu) requestAnimationFrame(render); };
if (btnQuit) btnQuit.onclick = function() { playAudio('clickUI'); var p = document.getElementById('pause-modal'); if (p) p.style.display = 'none'; if (btnHome) btnHome.click(); };

if (btnSound) btnSound.onclick = function(e) {
    playAudio('clickUI');
    if (audioAssets.bgm) {
        audioAssets.bgm.muted = !audioAssets.bgm.muted;
        e.target.innerText = audioAssets.bgm.muted ? '🔇' : '🔊';
    }
};

var bgmVol = document.getElementById('bgm-vol');
var sfxVol = document.getElementById('sfx-vol');

if (bgmVol) bgmVol.oninput = function(e) { 
    if (audioAssets.bgm) audioAssets.bgm.volume = parseFloat(e.target.value); 
};
if (sfxVol) sfxVol.oninput = function(e) { 
    sfxVolume = parseFloat(e.target.value); 
};

function handlePointerInput(clientX, clientY) {
    if (gameOver || isPaused || inMenu) return;
    var rect = canvas.getBoundingClientRect();
    var clickX = clientX - rect.left;
    var clickY = clientY - rect.top;

    for (var r = 0; r < ROWS; r++) {
        for (var c = 0; c < COLS; c++) {
            var block = grid[r][c];
            var dist = Math.hypot(block.x - clickX, block.y - clickY);
            if (dist < blockWidth * 0.48 && !block.blocked && (r !== mousePos.r || c !== mousePos.c)) {
                playAudio('grass');
                block.blocked = true;
                block.targetHeight = 12;
                moveMouse();
                return;
            }
        }
    }
}

canvas.addEventListener('pointerdown', function(e) { handlePointerInput(e.clientX, e.clientY); });
</script>
